    <!-- Structured Data - Course/Learning Platform -->
    <script type="application/ld+json">

      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://mlgrind.dev/?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Course",
      "name": "ML Grind",
      "description": "Learn machine learning by implementing algorithms from scratch. Covers NumPy, neural networks, CNNs, transformers, VAEs, diffusion models, and more.",
      "provider": {
        "@type": "Organization",
        "name": "ML Grind"
      },
      "copyrightYear": 2024,
      "copyrightHolder": {
        "@type": "Person",

      },

    <!-- Google Analytics (gtag.js) -->
    <script>
      (function() {
        try {
          if (navigator.doNotTrack === '1' || localStorage.getItem('mlgrind-analytics-disabled') === 'true') return;
        } catch (_) { return; }
        if (location.hostname === 'localhost' || location.hostname === '127.0.0.1') return;
        window.dataLayer = window.dataLayer || [];
        window.gtag = function(){dataLayer.push(arguments);};
        gtag('js', new Date());
        var config = {send_page_view: false, page_location: location.origin + location.pathname, allow_google_signals: false, allow_ad_personalization_signals: false};
        var campaign = new URLSearchParams(location.search);
        var fields = {utm_source: 'campaign_source', utm_medium: 'campaign_medium', utm_campaign: 'campaign_name', utm_content: 'campaign_content'};
        Object.keys(fields).forEach(function(key) {
          var value = campaign.get(key);
          if (value && /^[a-zA-Z0-9_-]{1,64}$/.test(value)) config[fields[key]] = value;
        });
        gtag('config', 'G-08K80C8WQX', config);
        var script = document.createElement('script');
        script.async = true;
        script.src = 'https://www.googletagmanager.com/gtag/js?id=G-08K80C8WQX';
        document.head.appendChild(script);
      })();
    </script>

    <!-- Single Page Apps for GitHub Pages -->
    <script type="text/javascript">
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) {
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>
    <style>
      /* Cover the prerendered crawler markup until React has painted the real
         page (removed in src/main.tsx). Fades out on its own after 8s in case
         the bundle never runs, so the static content stays readable. */
      #boot-splash{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:#f9fafb;transition:opacity .2s ease;animation:boot-hide .3s ease 8s forwards}
      html.dark #boot-splash{background:#0c0f14}
      #boot-splash span{width:28px;height:28px;border:3px solid rgba(108,92,231,.25);border-top-color:#6c5ce7;border-radius:50%;animation:boot-spin .8s linear infinite}
      @keyframes boot-spin{to{transform:rotate(360deg)}}
      @keyframes boot-hide{to{opacity:0;visibility:hidden}}
    </style>
    <noscript><style>#boot-splash{display:none}</style></noscript>
  </head>
  <body>
    <div id="boot-splash" aria-hidden="true"><span></span></div>
    <div id="root"></div>
    <script>
      // Apply theme before React loads to prevent flash
      (function() {
        var saved = null;
        try { saved = localStorage.getItem('ml-lab-dark-mode'); } catch (_) {}
        if (saved === 'false') {
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
