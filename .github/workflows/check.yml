name: Quality checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy
      - run: npm ci
      - run: npm run check
      - run: npm run test:runtime
      - run: npm run verify:static
      - run: npm audit --audit-level=moderate
      - run: npm ci --prefix worker
      - run: npm --prefix worker run typecheck
      - run: npm audit --prefix worker --audit-level=moderate
